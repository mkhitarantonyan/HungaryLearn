<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Диагностика звука</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; background: #f6efe4; color: #2a2320; }
  h1 { color: #57121c; }
  button { padding: 12px 24px; margin: 8px 8px 8px 0; font-size: 14px; cursor: pointer; border-radius: 8px; border: 2px solid #7a1e2b; background: #7a1e2b; color: white; }
  button:hover { background: #57121c; }
  button.green { border-color: #2c5f58; background: #2c5f58; }
  button.green:hover { background: #1f4845; }
  #log { background: #1a1a1a; color: #0f0; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 12px; white-space: pre-wrap; max-height: 400px; overflow-y: auto; margin-top: 20px; }
  .card { background: white; border: 1px solid #d9cbb0; border-radius: 12px; padding: 16px; margin: 12px 0; }
  .ok { color: #2c5f58; font-weight: bold; }
  .fail { color: #c24b3a; font-weight: bold; }
</style>
</head>
<body>
<h1>Диагностика звука — Hungarian Learn</h1>

<div class="card">
  <h3>1. Проверка MP3 файла диктора</h3>
  <p>Прямое воспроизведение <code>/audio/1.1.mp3</code></p>
  <button onclick="testMp3()">▶ Воспроизвести MP3</button>
  <button onclick="testMp3Fetch()" class="green">Проверить доступность файла</button>
</div>

<div class="card">
  <h3>2. Проверка API сервера</h3>
  <button onclick="testApi()" class="green">Проверить /api/audio-registry</button>
</div>

<div id="log"></div>

<script>
const logEl = document.getElementById('log');
function log(msg) {
  const time = new Date().toLocaleTimeString();
  logEl.textContent += `[${time}] ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
  console.log(msg);
}
log('=== Диагностика запущена ===');
log('User Agent: ' + navigator.userAgent);

function testMp3() {
  log('--- Test MP3: /audio/1.1.mp3 ---');
  try {
    const audio = new Audio('/audio/1.1.mp3');
    audio.preload = 'auto';
    audio.oncanplaythrough = () => log('MP3 can play through, duration: ' + audio.duration + 's');
    audio.onplay = () => log('MP3 playback STARTED');
    audio.onended = () => log('MP3 playback ENDED');
    audio.onerror = (e) => log('MP3 ERROR: code=' + audio.error?.code + ' (1=ABORTED,2=NETWORK,3=DECODE,4=NOT_FOUND)');
    audio.onstalled = () => log('MP3 stalled');
    audio.onwaiting = () => log('MP3 waiting for data');
    log('Calling audio.play()...');
    const p = audio.play();
    if (p !== undefined) {
      p.then(() => log('MP3 play() promise RESOLVED — playback should start'))
       .catch(err => log('MP3 play() promise REJECTED: ' + err.name + ' — ' + err.message));
    } else {
      log('MP3 play() returned undefined (old browser)');
    }
  } catch(e) {
    log('MP3 exception: ' + e.message);
  }
}

async function testMp3Fetch() {
  log('--- Fetch HEAD /audio/1.1.mp3 ---');
  try {
    const res = await fetch('/audio/1.1.mp3', { method: 'HEAD' });
    log('HTTP ' + res.status + ' | Content-Type: ' + res.headers.get('content-type') + ' | Size: ' + res.headers.get('content-length'));
  } catch(e) {
    log('Fetch FAILED: ' + e.message);
  }
}

async function testApi() {
  log('--- Fetch /api/audio-registry ---');
  try {
    const res = await fetch('/api/audio-registry');
    const data = await res.json();
    log('HTTP ' + res.status + ' | success=' + data.success + ' | entries=' + Object.keys(data.audio || {}).length);
    if (data.audio) {
      Object.entries(data.audio).slice(0, 5).forEach(([k,v]) => log('  ' + k + ' -> ' + v.url));
    }
  } catch(e) {
    log('API fetch FAILED: ' + e.message);
  }
}
</script>
</body>
</html>
