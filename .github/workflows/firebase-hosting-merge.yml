# Production deployment for HungaryLearn.
# Paid lesson bodies are served by the Firebase API Function.
# Lemon Squeezy checkout/webhooks are served by the billing Function.

name: Deploy Firebase production on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_USE_FIREBASE_EMULATORS: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Validate lessons
        run: |
          npm run validate:lessons
          npm run validate:vocabulary
          npm run validate:listening

      - name: Typecheck Functions
        run: npm run functions:typecheck

      - name: Build production frontend
        run: npm run build

      - name: Configure Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HUNGARYLEARN }}
        run: |
          CREDENTIALS_PATH="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDENTIALS_PATH"
          chmod 600 "$CREDENTIALS_PATH"

      - name: Configure Functions production parameters
        shell: bash
        env:
          LEMON_MONTHLY: ${{ vars.LEMONSQUEEZY_VARIANT_ID_MONTHLY }}
          LEMON_QUARTERLY: ${{ vars.LEMONSQUEEZY_VARIANT_ID_QUARTERLY }}
          LEMON_YEARLY: ${{ vars.LEMONSQUEEZY_VARIANT_ID_YEARLY }}
        run: |
          # Missing variables stay empty: deploy succeeds and checkout returns 503.
          # Validate before writing dotenv; never interpolate repository values as shell code.
          for variant in "$LEMON_MONTHLY" "$LEMON_QUARTERLY" "$LEMON_YEARLY"; do
            if [[ -n "$variant" && ! "$variant" =~ ^[1-9][0-9]+$ ]]; then
              echo 'Invalid Lemon variant parameter format' >&2
              exit 1
            fi
          done
          # Existing legacy ID is retained for Customer Portal only.
          printf '%s\n' \
            'LEMONSQUEEZY_TEST_MODE=false' \
            'LEMONSQUEEZY_STORE_ID=461197' \
            "LEMONSQUEEZY_VARIANT_ID_MONTHLY=$LEMON_MONTHLY" \
            "LEMONSQUEEZY_VARIANT_ID_QUARTERLY=$LEMON_QUARTERLY" \
            "LEMONSQUEEZY_VARIANT_ID_YEARLY=$LEMON_YEARLY" \
            'LEMONSQUEEZY_VARIANT_ID=2097546' \
            'APP_URL=https://hungarylearn.web.app' \
            > functions/.env.hungarylearn

      - name: Deploy Firebase Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npx firebase-tools@15.29.0 deploy --only "functions:api,functions:billing" --project hungarylearn --non-interactive

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HUNGARYLEARN }}
          channelId: live
          projectId: hungarylearn

      - name: Remove temporary Firebase credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/firebase-service-account.json"
          rm -f functions/.env.hungarylearn
